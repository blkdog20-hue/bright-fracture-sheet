<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bright Fracture: Kingdoms of Ash & Bone - Live Operative Sheet & GM Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f7fafc; color: #1a202c; font-family: ui-sans-serif, system-ui, sans-serif; }
    .card { background: white; border-radius: 0.5rem; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); padding: 1.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body class="p-4 max-w-6xl mx-auto">
  <header class="mb-6 flex flex-col md:flex-row justify-between items-center bg-slate-900 text-white p-4 rounded-lg shadow">
    <div>
      <h1 class="text-2xl font-bold">BRIGHT FRACTURE // OPERATIVE SHEET</h1>
      <p class="text-xs text-slate-400">Kingdoms of Ash & Bone — Live Cloud Sync</p>
    </div>
    <div class="mt-4 md:mt-0 flex items-center gap-3">
      <div id="connectionStatus" class="px-3 py-1 text-xs font-semibold rounded bg-emerald-600 text-white">🟢 Cloud Live (Connected)</div>
      <div class="text-sm bg-slate-800 px-3 py-1 rounded">Room: <span id="roomCodeDisplay" class="font-mono font-bold text-amber-400">BRIGHT-FRACTURE-MAIN</span></div>
    </div>
  </header>

  <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="md:col-span-1 card">
      <h2 class="text-lg font-bold mb-4 border-b pb-2">Operative Vitals</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600">Operative Name</label>
          <input type="text" id="opName" value="Vex Thorne" class="w-full border rounded p-2 text-sm font-bold">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">Current Flesh HP</label>
          <input type="number" id="currHP" value="22" class="w-full border rounded p-2 text-sm font-bold">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">Mana Capacity</label>
          <input type="number" id="manaCap" value="10" class="w-full border rounded p-2 text-sm font-bold">
        </div>
        <button id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm transition">Sync to Cloud</button>
      </div>
    </div>

    <div class="md:col-span-2 card">
      <h2 class="text-lg font-bold mb-4 border-b pb-2">Live Table Status Feed</h2>
      <div id="feedDisplay" class="bg-slate-50 border p-4 rounded h-48 overflow-y-auto text-sm text-slate-700 font-mono">
        Waiting for synchronization...
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Your verified Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCph7-y5VZ_ANWadcgVW02YnC6TPgRulsI",
      authDomain: "bright-fracture.firebaseapp.com",
      databaseURL: "https://bright-fracture-default-rtdb.firebaseio.com",
      projectId: "bright-fracture",
      storageBucket: "bright-fracture.firebasestorage.app",
      messagingSenderId: "603178324030",
      appId: "1:603178324030:web:472a66d3381e28ecf7c16f",
      measurementId: "G-S71GJD60VC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const roomRef = ref(db, 'rooms/BRIGHT-FRACTURE-MAIN/operative');
    const feedDisplay = document.getElementById('feedDisplay');

    // Live Read
    onValue(roomRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('opName').value = data.name || "Vex Thorne";
        document.getElementById('currHP').value = data.hp || 22;
        document.getElementById('manaCap').value = data.mana || 10;
        feedDisplay.innerHTML = `[${new Date().toLocaleTimeString()}] Synced: ${data.name} (HP: ${data.hp}, Mana: ${data.mana})<br>` + feedDisplay.innerHTML;
      }
    });

    // Live Write
    document.getElementById('saveBtn').addEventListener('click', () => {
      set(roomRef, {
        name: document.getElementById('opName').value,
        hp: document.getElementById('currHP').value,
        mana: document.getElementById('manaCap').value,
        lastUpdated: new Date().toLocaleTimeString()
      });
      alert("Synced successfully to Firebase Realtime Database!");
    });
  </script>
</body>
</html>
